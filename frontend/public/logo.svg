<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>

        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#174a7e" /> <!-- blue-800 -->
            <stop offset="100%" stop-color="#2678b8" /> <!-- blue-600 -->
        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#184e7d" flood-opacity="0.2" />
        </filter>
    </defs>

    <rect x="8" y="8" width="112" height="112" rx="25" fill="url(#bgGradient)" filter="url(#shadow)"/>

    <text
            x="64"
            y="64"
            font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
            font-weight="900"
            font-size="55"
            fill="#ffffff"
            text-anchor="middle"
            dominant-baseline="central"
            letter-spacing="-2.5"
    >
        KT
    </text>
</svg>